{{- define "main" -}}



<div class="container research-list-page">
  <div class="article-title mt-4 mb-4">
    <h1 class="mb-0 common-page-h1-title">
      {{ .Title | markdownify | emojify }}
    </h1>
    {{ with .Params.subtitle }}
    <p class="mt-1 common-page-subtitle">{{ . | markdownify | emojify }}</p>
    {{ end }}
  </div>

  <div class="list-content mt-4 mb-4">
     {{.Content}}
  </div>


</div>

{{- end -}}
